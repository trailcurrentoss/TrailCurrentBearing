<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Inter, Helvetica, Arial, sans-serif">

  <!-- Background -->
  <rect width="1100" height="620" fill="#f8f9fa"/>

  <!-- Title bar -->
  <rect width="1100" height="54" fill="#ffffff"/>
  <rect y="54" width="1100" height="3" fill="#52a441"/>
  <text x="24" y="35" font-size="16" font-weight="700" fill="#52a441">TrailCurrent Bearing</text>
  <text x="250" y="35" font-size="13" fill="#495057">Wiring the DFRobot Gravity GNSS to the Waveshare ESP32-S3-RS485-CAN (J4)</text>

  <!-- ============== PANEL 1: SH1.0 board-side, head-on view ============== -->
  <rect x="20" y="80" width="340" height="320" fill="#ffffff" stroke="#0d6efd" stroke-width="1.5" rx="6"/>
  <path d="M20,86 Q20,80 26,80 L354,80 Q360,80 360,86 L360,108 L20,108 Z" fill="#0d6efd"/>
  <text x="190" y="100" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">Bearing — J4 (SH1.0 4-pin), head-on view</text>

  <!-- Big head-on connector view: looking at the open end of the JST SH1.0 housing -->
  <!-- Connector body -->
  <rect x="50" y="140" width="280" height="64" fill="#0d2b52" stroke="#091a33" stroke-width="2" rx="3"/>
  <!-- Inner cavity -->
  <rect x="58" y="148" width="264" height="48" fill="#1a3f75" stroke="#091a33" stroke-width="1"/>

  <!-- 4 pin contacts -->
  <g>
    <rect x="76" y="160" width="32" height="24" fill="#ffd54f" stroke="#7a5a00" stroke-width="1.5"/>
    <rect x="138" y="160" width="32" height="24" fill="#ffd54f" stroke="#7a5a00" stroke-width="1.5"/>
    <rect x="200" y="160" width="32" height="24" fill="#ffd54f" stroke="#7a5a00" stroke-width="1.5"/>
    <rect x="262" y="160" width="32" height="24" fill="#ffd54f" stroke="#7a5a00" stroke-width="1.5"/>
  </g>

  <!-- Signal labels INSIDE the pin contacts -->
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#000">
    <text x="92" y="176">GND</text>
    <text x="154" y="176">3V3</text>
    <text x="216" y="176">SCL</text>
    <text x="278" y="176">SDA</text>
  </g>

  <!-- Pin-number labels BELOW each contact (schematic numbering) -->
  <g font-size="10" text-anchor="middle">
    <text x="92" y="220" fill="#212529" font-weight="700">Pin 4</text>
    <text x="154" y="220" fill="#212529" font-weight="700">Pin 3</text>
    <text x="216" y="220" fill="#212529" font-weight="700">Pin 2</text>
    <text x="278" y="220" fill="#212529" font-weight="700">Pin 1</text>

    <text x="92" y="234" fill="#6c757d" font-size="9">GND</text>
    <text x="154" y="234" fill="#6c757d" font-size="9">3V3 out</text>
    <text x="216" y="234" fill="#6c757d" font-size="9">GPIO 2</text>
    <text x="278" y="234" fill="#6c757d" font-size="9">GPIO 1</text>
  </g>

  <!-- "LEFT" and "RIGHT" orientation cues -->
  <text x="50" y="130" font-size="10" fill="#6c757d" font-style="italic">◀ leftmost</text>
  <text x="330" y="130" font-size="10" fill="#6c757d" font-style="italic" text-anchor="end">rightmost ▶</text>

  <!-- Verified-by-physical-inspection callout -->
  <rect x="40" y="252" width="300" height="42" fill="#d1e7dd" stroke="#198754" stroke-width="1.5" rx="4"/>
  <text x="190" y="269" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5132">Verified head-on against the physical board:</text>
  <text x="190" y="284" text-anchor="middle" font-size="10" fill="#0f5132">the leftmost contact is GND.</text>

  <!-- Source note -->
  <text x="190" y="318" text-anchor="middle" font-size="9" fill="#495057">JST SH series · 1.0 mm pitch · ref-des J4 on the Waveshare schematic</text>
  <text x="190" y="334" text-anchor="middle" font-size="9" fill="#6c757d">Pin numbers above match the schematic symbol</text>
  <text x="190" y="348" text-anchor="middle" font-size="9" fill="#6c757d">(DOCS/ESP32-S3-RS485-CAN-Schematic.pdf, sheet 1).</text>
  <text x="190" y="375" text-anchor="middle" font-size="9" fill="#6c757d">GPIO assignments (SDA=GPIO1, SCL=GPIO2) per</text>
  <text x="190" y="389" text-anchor="middle" font-size="9" fill="#6c757d">main/main.c (I2C_SDA_PIN, I2C_SCL_PIN).</text>

  <!-- ============== PANEL 2: Wiring table ============== -->
  <rect x="380" y="80" width="340" height="320" fill="#ffffff" stroke="#52a441" stroke-width="1.5" rx="6"/>
  <path d="M380,86 Q380,80 386,80 L714,80 Q720,80 720,86 L720,108 L380,108 Z" fill="#52a441"/>
  <text x="550" y="100" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">Cable wiring — signal by signal</text>

  <!-- Column headers -->
  <rect x="400" y="130" width="300" height="22" fill="#e9ecef" stroke="#ced4da"/>
  <text x="430" y="146" font-size="11" font-weight="700" fill="#212529" text-anchor="middle">Signal</text>
  <text x="510" y="146" font-size="11" font-weight="700" fill="#212529" text-anchor="middle">Bearing J4</text>
  <text x="600" y="146" font-size="11" font-weight="700" fill="#212529" text-anchor="middle">GNSS P3</text>
  <text x="675" y="146" font-size="11" font-weight="700" fill="#212529" text-anchor="middle">Wire</text>

  <!-- Row: GND -->
  <rect x="400" y="152" width="300" height="32" fill="#ffffff" stroke="#ced4da"/>
  <rect x="406" y="158" width="14" height="20" fill="#000000" rx="2"/>
  <text x="432" y="172" text-anchor="start" font-size="11" font-weight="700" fill="#212529">GND</text>
  <text x="510" y="172" text-anchor="middle" font-size="11" fill="#212529">Pin 4</text>
  <text x="600" y="172" text-anchor="middle" font-size="11" fill="#212529">Pin 3  ( - )</text>
  <text x="675" y="172" text-anchor="middle" font-size="11" fill="#212529">Black</text>

  <!-- Row: VCC / 3V3 -->
  <rect x="400" y="184" width="300" height="32" fill="#fdfdff" stroke="#ced4da"/>
  <rect x="406" y="190" width="14" height="20" fill="#dc3545" rx="2"/>
  <text x="432" y="204" text-anchor="start" font-size="11" font-weight="700" fill="#212529">VCC</text>
  <text x="510" y="204" text-anchor="middle" font-size="11" fill="#212529">Pin 3  (3V3)</text>
  <text x="600" y="204" text-anchor="middle" font-size="11" fill="#212529">Pin 4  ( + )</text>
  <text x="675" y="204" text-anchor="middle" font-size="11" fill="#212529">Red</text>

  <!-- Row: SCL -->
  <rect x="400" y="216" width="300" height="32" fill="#ffffff" stroke="#ced4da"/>
  <rect x="406" y="222" width="14" height="20" fill="#0d6efd" rx="2"/>
  <text x="432" y="236" text-anchor="start" font-size="11" font-weight="700" fill="#212529">SCL</text>
  <text x="510" y="236" text-anchor="middle" font-size="11" fill="#212529">Pin 2  (GPIO 2)</text>
  <text x="600" y="236" text-anchor="middle" font-size="11" fill="#212529">Pin 2  (C/R)</text>
  <text x="675" y="236" text-anchor="middle" font-size="11" fill="#212529">Blue</text>

  <!-- Row: SDA -->
  <rect x="400" y="248" width="300" height="32" fill="#fdfdff" stroke="#ced4da"/>
  <rect x="406" y="254" width="14" height="20" fill="#198754" rx="2"/>
  <text x="432" y="268" text-anchor="start" font-size="11" font-weight="700" fill="#212529">SDA</text>
  <text x="510" y="268" text-anchor="middle" font-size="11" fill="#212529">Pin 1  (GPIO 1)</text>
  <text x="600" y="268" text-anchor="middle" font-size="11" fill="#212529">Pin 1  (D/T)</text>
  <text x="675" y="268" text-anchor="middle" font-size="11" fill="#212529">Green</text>

  <!-- Footnote -->
  <rect x="400" y="300" width="300" height="80" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5" rx="4"/>
  <text x="412" y="317" font-size="10" font-weight="700" fill="#664d03">SCL and SDA happen to match pin-for-pin —</text>
  <text x="412" y="331" font-size="9" fill="#664d03">only the power pair (Bearing Pins 3↔4 vs GNSS Pins 3↔4) swaps.</text>
  <text x="412" y="345" font-size="9" fill="#664d03">A stock straight-through cable will reverse the power pair,</text>
  <text x="412" y="357" font-size="9" fill="#664d03">which will damage the GNSS module. Hand-solder a cable with</text>
  <text x="412" y="369" font-size="9" fill="#664d03">SH1.0 4-pin on the Bearing end and PH2.0 4-pin on the GNSS end.</text>

  <!-- ============== PANEL 3: GNSS Gravity P3 ============== -->
  <rect x="740" y="80" width="340" height="320" fill="#ffffff" stroke="#e0a800" stroke-width="1.5" rx="6"/>
  <path d="M740,86 Q740,80 746,80 L1074,80 Q1080,80 1080,86 L1080,108 L740,108 Z" fill="#e0a800"/>
  <text x="910" y="100" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">DFRobot GNSS — P3 (PH2.0 4-pin)</text>

  <!-- Connector view (head-on, left → right: D/T, C/R, -, +) -->
  <rect x="770" y="140" width="280" height="64" fill="#fff3cd" stroke="#997404" stroke-width="2" rx="3"/>
  <rect x="778" y="148" width="264" height="48" fill="#ffeaa0" stroke="#997404" stroke-width="1"/>

  <g>
    <rect x="796" y="160" width="32" height="24" fill="#198754" stroke="#0d4d2e" stroke-width="1.5"/>
    <rect x="858" y="160" width="32" height="24" fill="#0d6efd" stroke="#0a3d99" stroke-width="1.5"/>
    <rect x="920" y="160" width="32" height="24" fill="#212529" stroke="#000" stroke-width="1.5"/>
    <rect x="982" y="160" width="32" height="24" fill="#dc3545" stroke="#7a1a25" stroke-width="1.5"/>
  </g>

  <!-- Signal labels INSIDE (silk-screen abbreviations) -->
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="812" y="176">D/T</text>
    <text x="874" y="176">C/R</text>
    <text x="936" y="176">-</text>
    <text x="998" y="176">+</text>
  </g>

  <!-- Pin numbers and signal mapping -->
  <g font-size="10" text-anchor="middle">
    <text x="812" y="220" fill="#212529" font-weight="700">Pin 1</text>
    <text x="874" y="220" fill="#212529" font-weight="700">Pin 2</text>
    <text x="936" y="220" fill="#212529" font-weight="700">Pin 3</text>
    <text x="998" y="220" fill="#212529" font-weight="700">Pin 4</text>

    <text x="812" y="234" fill="#6c757d" font-size="9">SDA / TX</text>
    <text x="874" y="234" fill="#6c757d" font-size="9">SCL / RX</text>
    <text x="936" y="234" fill="#6c757d" font-size="9">GND</text>
    <text x="998" y="234" fill="#6c757d" font-size="9">VCC</text>
  </g>

  <!-- LEFT / RIGHT orientation cues -->
  <text x="770" y="130" font-size="10" fill="#6c757d" font-style="italic">◀ leftmost</text>
  <text x="1050" y="130" font-size="10" fill="#6c757d" font-style="italic" text-anchor="end">rightmost ▶</text>

  <!-- Verified-by-physical-inspection callout -->
  <rect x="760" y="252" width="300" height="42" fill="#d1e7dd" stroke="#198754" stroke-width="1.5" rx="4"/>
  <text x="910" y="269" text-anchor="middle" font-size="10" font-weight="700" fill="#0f5132">Verified head-on against the physical module:</text>
  <text x="910" y="284" text-anchor="middle" font-size="10" fill="#0f5132">silk reads (right → left)  +,  - ,  C/R,  D/T.</text>

  <!-- Source note -->
  <text x="910" y="318" text-anchor="middle" font-size="9" fill="#495057">DFRobot Gravity 4-pin · PH 2.0 mm pitch</text>
  <text x="910" y="334" text-anchor="middle" font-size="9" fill="#6c757d">Pin numbers per the schematic symbol in</text>
  <text x="910" y="348" text-anchor="middle" font-size="9" fill="#6c757d">EDA/DFRobot_Gnss_Schematic.png (P3).</text>
  <text x="910" y="375" text-anchor="middle" font-size="9" fill="#6c757d">Wire colors are the DFRobot Gravity factory convention;</text>
  <text x="910" y="389" text-anchor="middle" font-size="9" fill="#6c757d">on third-party cables, verify color → signal yourself.</text>

  <!-- ============== CAN BUS MESSAGES ============== -->
  <rect x="20" y="420" width="1060" height="138" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" rx="6"/>
  <text x="550" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="#212529">CAN Bus Messages — 500 kbps, screw terminal block (H, L)</text>

  <text x="40" y="466" font-size="11" fill="#198754" font-weight="700">TX (GNSS Data @ 30 Hz)</text>
  <text x="40" y="482" font-size="10" fill="#495057">0x06  DateTime  [yr_H, yr_L, mo, day, hr, min, sec]</text>
  <text x="40" y="496" font-size="10" fill="#495057">0x07  Navigation  [sats, spd_H, spd_L, crs_H, crs_L, mode]</text>
  <text x="40" y="510" font-size="10" fill="#495057">0x08  Altitude  [alt_3, alt_2, alt_1, alt_0]</text>
  <text x="40" y="524" font-size="10" fill="#495057">0x09  LatLon  [lat_s, lat_2, lat_1, lat_0, lon_s, lon_2, lon_1, lon_0]</text>

  <text x="600" y="466" font-size="11" fill="#dc3545" font-weight="700">RX (Control)</text>
  <text x="600" y="482" font-size="10" fill="#495057">0x00  OTA Trigger</text>
  <text x="600" y="496" font-size="10" fill="#495057">0x01  WiFi Config</text>
  <text x="600" y="510" font-size="10" fill="#495057">0x02  Discovery</text>

  <text x="600" y="540" font-size="10" fill="#495057">Power: screw terminal block, 7-36 V DC (V+, V-)</text>

  <!-- Footer -->
  <rect y="580" width="1100" height="40" fill="#ffffff"/>
  <rect y="580" width="1100" height="1" fill="#dee2e6"/>
  <text x="24" y="601" font-size="9" fill="#52a441" font-weight="600">TrailCurrent</text>
  <text x="110" y="601" font-size="9" fill="#6c757d">Bearing v1.0 — GNSS wiring reference</text>
</svg>
